<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_lux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4f4f5"/>
      <stop offset="100%" stop-color="#e4e4e7"/>
    </linearGradient>
    <filter id="shadow_lux" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#18181b" flood-opacity="0.12"/>
    </filter>
    <filter id="phoneShadow_lux" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg_lux)"/>

  <!-- Desktop Browser Window -->
  <g transform="translate(40, 40)" filter="url(#shadow_lux)">
    <rect width="520" height="380" rx="14" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <!-- Browser Top Bar -->
    <path d="M0 14 C0 6.27 6.27 0 14 0 L506 0 C513.73 0 520 6.27 520 14 L520 36 L0 36 Z" fill="#fafafa"/>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#e4e4e7" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#d4d4d8"/>
    <circle cx="36" cy="18" r="5" fill="#d4d4d8"/>
    <circle cx="52" cy="18" r="5" fill="#d4d4d8"/>
    <rect x="76" y="10" width="220" height="16" rx="6" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
    <rect x="96" y="15" width="90" height="6" rx="3" fill="#a1a1aa"/>

    <!-- Desktop Content -->
    <!-- Minimalist Brand Header -->
    <text x="35" y="58" font-family="'Times New Roman', serif" font-size="14" font-weight="bold" letter-spacing="2" fill="#18181b">L U X E</text>
    <rect x="250" y="52" width="35" height="6" rx="3" fill="#71717a"/>
    <rect x="300" y="52" width="35" height="6" rx="3" fill="#71717a"/>
    <rect x="350" y="52" width="35" height="6" rx="3" fill="#71717a"/>
    <circle cx="475" cy="54" r="7" fill="#f4f4f5"/>
    <circle cx="495" cy="54" r="7" fill="#18181b"/>

    <!-- High Fashion Editorial Banner -->
    <rect x="20" y="72" width="480" height="130" rx="4" fill="#18181b"/>
    <text x="40" y="118" font-family="system-ui, sans-serif" font-size="20" font-weight="900" letter-spacing="1" fill="#ffffff">المتجر الفاخر (Luxury Store)</text>
    <text x="40" y="142" font-family="system-ui, sans-serif" font-size="11" letter-spacing="0.5" fill="#a1a1aa">تصميم إيديتوريال راقٍ للماركات والعلامات التجارية الفخمة</text>
    <rect x="40" y="156" width="110" height="26" rx="3" fill="#ffffff"/>
    <text x="56" y="173" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#18181b">تصفح التشكيلة</text>

    <!-- Fashion 3:4 Product Grid -->
    <g transform="translate(20, 215)">
      <!-- Card 1 -->
      <rect width="150" height="185" rx="4" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
      <rect x="10" y="10" width="130" height="105" rx="2" fill="#f4f4f5"/>
      <circle cx="75" cy="62" r="24" fill="#e4e4e7"/>
      <text x="12" y="132" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#18181b">عطر لوكس الأصلي</text>
      <text x="12" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#71717a">1,450 ج.م</text>

      <!-- Card 2 -->
      <g transform="translate(165, 0)">
        <rect width="150" height="185" rx="4" fill="#ffffff" stroke="#e4e4e7" stroke-width="1"/>
        <rect x="10" y="10" width="130" height="105" rx="2" fill="#f4f4f5"/>
        <rect x="55" y="40" width="40" height="45" rx="4" fill="#e4e4e7"/>
        <text x="12" y="132" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#18181b">حقيبة جلدية فاخرة</text>
        <text x="12" y="148" font-family="system-ui, sans-serif" font-size="10" fill="#71717a">2,890 ج.م</text>
      </g>
    </g>
  </g>

  <!-- Mobile Phone Mockup (Front) -->
  <g transform="translate(520, 50)" filter="url(#phoneShadow_lux)">
    <!-- Phone Body -->
    <rect width="220" height="420" rx="32" fill="#09090b" stroke="#27272a" stroke-width="3"/>
    <rect x="8" y="8" width="204" height="404" rx="26" fill="#ffffff"/>
    
    <!-- Notch -->
    <rect x="65" y="14" width="90" height="18" rx="9" fill="#09090b"/>

    <!-- Screen Content -->
    <g transform="translate(8, 38)">
      <text x="16" y="20" font-family="'Times New Roman', serif" font-size="12" font-weight="bold" letter-spacing="1" fill="#18181b">L U X E</text>
      <circle cx="185" cy="16" r="6" fill="#18181b"/>

      <!-- Editorial Image 3:4 -->
      <rect x="12" y="32" width="180" height="180" rx="4" fill="#f4f4f5"/>
      <circle cx="102" cy="122" r="36" fill="#e4e4e7"/>

      <!-- Title & Details -->
      <text x="14" y="230" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#18181b">ساعة أنيقة إصدار محدود</text>
      <text x="14" y="248" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#d97706">3,200 ج.م</text>

      <!-- Clean Black Buy Button -->
      <rect x="12" y="270" width="180" height="34" rx="6" fill="#18181b"/>
      <text x="56" y="292" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">إضافة إلى الحقيبة</text>

      <rect x="12" y="315" width="180" height="45" rx="6" fill="#fafafa" stroke="#e4e4e7" stroke-width="1"/>
      <text x="24" y="342" font-family="system-ui, sans-serif" font-size="10" fill="#71717a">تفاصيل المنتج والمقاسات ▾</text>
    </g>
  </g>
</svg>