<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_mod" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <filter id="shadow_mod" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#0f172a" flood-opacity="0.1"/>
    </filter>
    <filter id="phoneShadow_mod" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg_mod)"/>

  <!-- Desktop Browser Window -->
  <g transform="translate(40, 40)" filter="url(#shadow_mod)">
    <rect width="520" height="380" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M0 14 C0 6.27 6.27 0 14 0 L506 0 C513.73 0 520 6.27 520 14 L520 36 L0 36 Z" fill="#ffffff"/>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#f1f5f9" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#e2e8f0"/>
    <circle cx="36" cy="18" r="5" fill="#e2e8f0"/>
    <circle cx="52" cy="18" r="5" fill="#e2e8f0"/>
    <rect x="76" y="10" width="220" height="16" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>

    <text x="35" y="58" font-family="system-ui, sans-serif" font-size="14" font-weight="900" fill="#0f172a">MODERN</text>
    <rect x="250" y="52" width="35" height="6" rx="3" fill="#94a3b8"/>
    <rect x="300" y="52" width="35" height="6" rx="3" fill="#94a3b8"/>
    <rect x="350" y="52" width="35" height="6" rx="3" fill="#94a3b8"/>

    <!-- Banner -->
    <rect x="20" y="72" width="480" height="130" rx="16" fill="#0f172a"/>
    <text x="40" y="118" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" fill="#ffffff">المتجر العصري (Modern Minimal)</text>
    <text x="40" y="142" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">بساطة وانسيابية فائقة مع لمسات زجاجية عصرية</text>
    <rect x="40" y="156" width="100" height="26" rx="13" fill="#3b82f6"/>
    <text x="60" y="173" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">استكشف</text>

    <!-- Products -->
    <g transform="translate(20, 215)">
      <rect width="150" height="185" rx="12" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
      <rect x="10" y="10" width="130" height="95" rx="8" fill="#f8fafc"/>
      <text x="12" y="126" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">منتج بتصميم استثنائي</text>
      <text x="12" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">890 ج.م</text>

      <g transform="translate(165, 0)">
        <rect width="150" height="185" rx="12" fill="#ffffff" stroke="#f1f5f9" stroke-width="1"/>
        <rect x="10" y="10" width="130" height="95" rx="8" fill="#f8fafc"/>
        <text x="12" y="126" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#0f172a">سماعات لاسلكية برو</text>
        <text x="12" y="142" font-family="system-ui, sans-serif" font-size="10" fill="#3b82f6">1,250 ج.م</text>
      </g>
    </g>
  </g>

  <!-- Mobile Phone Mockup -->
  <g transform="translate(520, 50)" filter="url(#phoneShadow_mod)">
    <rect width="220" height="420" rx="32" fill="#020617" stroke="#1e293b" stroke-width="3"/>
    <rect x="8" y="8" width="204" height="404" rx="26" fill="#ffffff"/>
    <rect x="65" y="14" width="90" height="18" rx="9" fill="#020617"/>

    <g transform="translate(8, 38)">
      <text x="16" y="20" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">MODERN</text>

      <rect x="12" y="32" width="180" height="160" rx="14" fill="#f8fafc"/>
      <circle cx="102" cy="112" r="32" fill="#e2e8f0"/>

      <text x="14" y="215" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#0f172a">ساعة ذكية ألترا</text>
      <text x="14" y="234" font-family="system-ui, sans-serif" font-size="12" font-weight="bold" fill="#3b82f6">1,750 ج.م</text>

      <rect x="12" y="255" width="180" height="34" rx="17" fill="#0f172a"/>
      <text x="65" y="277" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">طلب فوري</text>
    </g>
  </g>
</svg>