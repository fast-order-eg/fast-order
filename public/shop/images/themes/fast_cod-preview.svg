<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ecfdf5"/>
      <stop offset="100%" stop-color="#d1fae5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#064e3b" flood-opacity="0.15"/>
    </filter>
    <filter id="phoneShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#bg)"/>

  <!-- Desktop Browser Window -->
  <g transform="translate(40, 40)" filter="url(#shadow)">
    <!-- Browser Frame -->
    <rect width="520" height="380" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Browser Top Bar -->
    <path d="M0 14 C0 6.27 6.27 0 14 0 L506 0 C513.73 0 520 6.27 520 14 L520 36 L0 36 Z" fill="#f8fafc"/>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#e2e8f0" stroke-width="1"/>
    <!-- Dots -->
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <rect x="76" y="10" width="220" height="16" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="86" cy="18" r="3" fill="#10b981"/>
    <rect x="96" y="15" width="80" height="6" rx="3" fill="#94a3b8"/>

    <!-- Desktop Content -->
    <!-- Store Header -->
    <rect x="20" y="48" width="60" height="14" rx="4" fill="#16a34a"/>
    <rect x="280" y="52" width="40" height="6" rx="3" fill="#64748b"/>
    <rect x="330" y="52" width="40" height="6" rx="3" fill="#64748b"/>
    <rect x="380" y="52" width="40" height="6" rx="3" fill="#64748b"/>
    <rect x="440" y="48" width="60" height="14" rx="4" fill="#16a34a"/>

    <!-- Hero Banner -->
    <rect x="20" y="72" width="480" height="130" rx="10" fill="#15803d"/>
    <text x="40" y="115" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">سريع كود (COD Express)</text>
    <text x="40" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#bbf7d0">أعلى نسبة تحويل • فورم مباشر • دفع عند الاستلام</text>
    <rect x="40" y="155" width="100" height="26" rx="6" fill="#f97316"/>
    <text x="58" y="172" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">اطلب الآن ⚡</text>

    <!-- Product Cards Grid -->
    <g transform="translate(20, 215)">
      <!-- Card 1 -->
      <rect width="150" height="185" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="10" y="10" width="130" height="85" rx="6" fill="#dcfce7"/>
      <rect x="10" y="105" width="90" height="8" rx="4" fill="#0f172a"/>
      <rect x="10" y="120" width="50" height="8" rx="4" fill="#16a34a"/>
      <rect x="10" y="140" width="130" height="24" rx="6" fill="#16a34a"/>
      <text x="50" y="156" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">شراء سريع</text>

      <!-- Card 2 -->
      <g transform="translate(165, 0)">
        <rect width="150" height="185" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="10" y="10" width="130" height="85" rx="6" fill="#e0e7ff"/>
        <rect x="10" y="105" width="80" height="8" rx="4" fill="#0f172a"/>
        <rect x="10" y="120" width="45" height="8" rx="4" fill="#16a34a"/>
        <rect x="10" y="140" width="130" height="24" rx="6" fill="#16a34a"/>
        <text x="50" y="156" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">شراء سريع</text>
      </g>
    </g>
  </g>

  <!-- Mobile Phone Mockup (Front) -->
  <g transform="translate(520, 50)" filter="url(#phoneShadow)">
    <!-- Phone Body -->
    <rect width="220" height="420" rx="32" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <!-- Phone Bezel Screen -->
    <rect x="8" y="8" width="204" height="404" rx="26" fill="#ffffff"/>
    
    <!-- Dynamic Island / Notch -->
    <rect x="65" y="14" width="90" height="18" rx="9" fill="#0f172a"/>
    <circle cx="138" cy="23" r="3" fill="#1e293b"/>

    <!-- Mobile Screen Content -->
    <g transform="translate(8, 38)">
      <!-- Top Bar -->
      <rect x="12" y="10" width="50" height="10" rx="3" fill="#16a34a"/>
      <circle cx="180" cy="15" r="7" fill="#f1f5f9"/>

      <!-- Product Image -->
      <rect x="12" y="30" width="180" height="120" rx="10" fill="#dcfce7"/>
      <circle cx="102" cy="90" r="30" fill="#16a34a" opacity="0.2"/>

      <!-- Title & Price -->
      <rect x="12" y="160" width="130" height="10" rx="4" fill="#0f172a"/>
      <rect x="12" y="178" width="70" height="12" rx="4" fill="#16a34a"/>

      <!-- Direct COD Checkout Form -->
      <rect x="12" y="200" width="180" height="110" rx="8" fill="#f0fdf4" stroke="#86efac" stroke-width="1"/>
      <text x="22" y="220" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#15803d">⚡ اطلب الآن والدفع عند الاستلام</text>
      <rect x="22" y="232" width="160" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="22" y="256" width="160" height="18" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
      <rect x="22" y="280" width="160" height="24" rx="6" fill="#16a34a"/>
      <text x="60" y="296" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">تأكيد الطلب فوراً</text>

      <!-- Sticky Buy Bar at bottom of screen -->
      <rect x="0" y="330" width="204" height="42" fill="#0f172a"/>
      <rect x="12" y="337" width="180" height="28" rx="8" fill="#16a34a"/>
      <text x="65" y="355" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">اشتري الآن 🛒</text>
    </g>
  </g>
</svg>