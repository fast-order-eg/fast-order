<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg_def" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff"/>
      <stop offset="100%" stop-color="#dbeafe"/>
    </linearGradient>
    <filter id="shadow_def" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e3a8a" flood-opacity="0.12"/>
    </filter>
    <filter id="phoneShadow_def" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="4" dy="18" stdDeviation="18" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg_def)"/>

  <!-- Desktop Browser Window -->
  <g transform="translate(40, 40)" filter="url(#shadow_def)">
    <rect width="520" height="380" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <path d="M0 14 C0 6.27 6.27 0 14 0 L506 0 C513.73 0 520 6.27 520 14 L520 36 L0 36 Z" fill="#f8fafc"/>
    <line x1="0" y1="36" x2="520" y2="36" stroke="#e2e8f0" stroke-width="1"/>
    <circle cx="20" cy="18" r="5" fill="#ef4444"/>
    <circle cx="36" cy="18" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="18" r="5" fill="#10b981"/>
    <rect x="76" y="10" width="220" height="16" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="96" y="15" width="80" height="6" rx="3" fill="#94a3b8"/>

    <!-- Store Header -->
    <rect x="20" y="48" width="60" height="14" rx="4" fill="#2563eb"/>
    <rect x="280" y="52" width="40" height="6" rx="3" fill="#64748b"/>
    <rect x="330" y="52" width="40" height="6" rx="3" fill="#64748b"/>
    <rect x="380" y="52" width="40" height="6" rx="3" fill="#64748b"/>
    <circle cx="490" cy="55" r="8" fill="#eff6ff"/>

    <!-- Hero Banner -->
    <rect x="20" y="72" width="480" height="130" rx="10" fill="#1d4ed8"/>
    <text x="40" y="115" font-family="system-ui, sans-serif" font-size="18" font-weight="bold" fill="#ffffff">المتجر الكلاسيكي (Classic Store)</text>
    <text x="40" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#bfdbfe">المتجر الشامل والمتوازن لكافة الأنشطة والمنتجات</text>
    <rect x="40" y="155" width="100" height="26" rx="6" fill="#f59e0b"/>
    <text x="60" y="172" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">تسوق الآن</text>

    <!-- Product Cards Grid -->
    <g transform="translate(20, 215)">
      <rect width="150" height="185" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="10" y="10" width="130" height="85" rx="6" fill="#dbeafe"/>
      <rect x="10" y="105" width="90" height="8" rx="4" fill="#0f172a"/>
      <rect x="10" y="120" width="50" height="8" rx="4" fill="#2563eb"/>
      <rect x="10" y="140" width="130" height="24" rx="6" fill="#2563eb"/>
      <text x="50" y="156" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">أضف للسلة</text>

      <g transform="translate(165, 0)">
        <rect width="150" height="185" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
        <rect x="10" y="10" width="130" height="85" rx="6" fill="#fee2e2"/>
        <rect x="10" y="105" width="80" height="8" rx="4" fill="#0f172a"/>
        <rect x="10" y="120" width="45" height="8" rx="4" fill="#2563eb"/>
        <rect x="10" y="140" width="130" height="24" rx="6" fill="#2563eb"/>
        <text x="50" y="156" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff">أضف للسلة</text>
      </g>
    </g>
  </g>

  <!-- Mobile Phone Mockup -->
  <g transform="translate(520, 50)" filter="url(#phoneShadow_def)">
    <rect width="220" height="420" rx="32" fill="#0f172a" stroke="#334155" stroke-width="3"/>
    <rect x="8" y="8" width="204" height="404" rx="26" fill="#ffffff"/>
    <rect x="65" y="14" width="90" height="18" rx="9" fill="#0f172a"/>

    <g transform="translate(8, 38)">
      <rect x="12" y="10" width="50" height="10" rx="3" fill="#2563eb"/>
      <circle cx="180" cy="15" r="7" fill="#f1f5f9"/>

      <rect x="12" y="30" width="180" height="120" rx="10" fill="#dbeafe"/>
      <circle cx="102" cy="90" r="30" fill="#2563eb" opacity="0.2"/>

      <rect x="12" y="160" width="130" height="10" rx="4" fill="#0f172a"/>
      <rect x="12" y="178" width="70" height="12" rx="4" fill="#2563eb"/>

      <rect x="12" y="210" width="180" height="34" rx="8" fill="#2563eb"/>
      <text x="58" y="232" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#ffffff">أضف إلى السلة 🛒</text>

      <rect x="12" y="255" width="85" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
      <rect x="107" y="255" width="85" height="100" rx="6" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    </g>
  </g>
</svg>