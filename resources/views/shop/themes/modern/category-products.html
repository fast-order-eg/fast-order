  <script>
    let allProducts = []; // Store all products for filtering
    let currentFilter = 'default';

    // Get category ID from URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    const categoryId = urlParams.get('id');
    const categoryName = urlParams.get('name');

    if (!categoryId) {
      document.getElementById('productsGrid').innerHTML = '<p class="muted">???? ????? ??? ????.</p>';
    } else {
      loadCategoryProducts(categoryId, categoryName);
    }

    // Filter dropdown functionality
    const filterBtn = document.getElementById('filterBtn');
    const filterMenu = document.getElementById('filterMenu');
    const filterOptions = document.querySelectorAll('.filter-option');

    filterBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      filterMenu.style.display = filterMenu.style.display === 'none' ? 'block' : 'none';
    });

    // Close filter menu when clicking outside
    document.addEventListener('click', () => {
      filterMenu.style.display = 'none';
    });

    filterMenu.addEventListener('click', (e) => {
      e.stopPropagation();
    });

    // Handle filter option selection
    filterOptions.forEach(option => {
      option.addEventListener('click', () => {
        const filterType = option.dataset.filter;
        currentFilter = filterType;

        // Update button text
        const filterText = option.textContent.trim();
        filterBtn.innerHTML = `<i class="fa fa-filter"></i> ${filterText} <i class="fa fa-chevron-down"></i>`;

        // Apply filter
        applyFilter(filterType);
        filterMenu.style.display = 'none';
      });
    });

    function applyFilter(filterType) {
      let sortedProducts = [...allProducts];

      switch (filterType) {
        case 'price-low':
          sortedProducts.sort((a, b) => {
            const priceA = a.price_after || a.price_before || 0;
            const priceB = b.price_after || b.price_before || 0;
            return priceA - priceB;
          });
          break;

        case 'price-high':
          sortedProducts.sort((a, b) => {
            const priceA = a.price_after || a.price_before || 0;
            const priceB = b.price_after || b.price_before || 0;
            return priceB - priceA;
          });
          break;

        case 'discount':
          sortedProducts.sort((a, b) => {
            const discountA = calculateDiscount(a.price_before, a.price_after);
            const discountB = calculateDiscount(b.price_before, b.price_after);
            return discountB - discountA;
          });
          break;

        default:
          // Default order (by ID descending)
          sortedProducts.sort((a, b) => b.id - a.id);
          break;
      }

      renderProducts(document.getElementById('productsGrid'), sortedProducts);
    }

    function calculateDiscount(priceBefore, priceAfter) {
      if (!priceBefore || !priceAfter || priceBefore <= priceAfter) {
        return 0;
      }
      return ((priceBefore - priceAfter) / priceBefore) * 100;
    }

    async function loadCategoryProducts(categoryId, categoryName) {
      try {
        // Load category details
        const categoryResponse = await fetch(`${window.API_BASE}/categories`);
        const categoryData = await categoryResponse.json();

        if (categoryData.data) {
          const category = categoryData.data.find(c => c.id == categoryId);
          if (category) {
            document.getElementById('categoryName').textContent = category.name || '???';
            document.title = `${category.name} - Store`;
          }
        }

        // Load products for this category
        const productsResponse = await fetch(`${window.API_BASE}/products?category_id=${categoryId}`);
        const productsData = await productsResponse.json();

        const productsGrid = document.getElementById('productsGrid');
        const emptyState = document.getElementById('emptyState');

        if (productsData.data && productsData.data.length > 0) {
          allProducts = productsData.data; // Store all products
          renderProducts(productsGrid, allProducts);
          emptyState.style.display = 'none';
        } else {
          productsGrid.style.display = 'none';
          emptyState.style.display = 'block';
        }

      } catch (error) {
        console.error('??? ?? ????? ?????? ?????:', error);
        document.getElementById('productsGrid').innerHTML = '<p class="muted">??? ??? ?? ????? ????????.</p>';
      }
    }
  </script>

  <script>
    // Load settings dynamically (logo, phone, whatsapp)
    (function () {
      var API = window.API_BASE || '/public-api';
      fetch(API + '/settings').then(function (r) { return r.json(); }).then(function (res) {
        var data = res.data;
        if (!data) return;
        if (data.logo_url) {
          var logos = document.querySelectorAll('img.site-logo, .brand img:first-child, .brand img');
          logos.forEach(function (el) { el.src = data.logo_url; });
        }
        if (data.store_name) {
          var names = document.querySelectorAll('.site-name, .brand span:first-of-type');
          names.forEach(function (el) { el.textContent = data.store_name; });
        }
        if (data.phone) {
          var callBtns = document.querySelectorAll('a.call-now, a[href^="tel:"]');
          callBtns.forEach(function (el) { el.href = 'tel:' + data.phone; });
        }
        if (data.whatsapp) {
          var waBtns = document.querySelectorAll('a.wapp-float, a[href*="wa.me"]');
          waBtns.forEach(function (el) { el.href = 'https://wa.me/' + data.whatsapp; });
        }
        if (data.facebook_page) {
          var fbBtns = document.querySelectorAll('a[href*="facebook.com"]');
          fbBtns.forEach(function (el) { el.href = data.facebook_page; });
        }
      }).catch(function () { });
    })();
  </script>
