  <style>
    /* ===== Cart Page Styles ===== */
    .cart-page { padding: 1.25rem 0 4rem; }
    .cart-page-title {
      font-size: 1.6rem;
      font-weight: 900;
      margin-bottom: 1.25rem;
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }
    .cart-count-badge {
      font-size: 0.85rem;
      background: var(--primary-color, #4f46e5);
      color: #fff;
      border-radius: 20px;
      padding: 0.2rem 0.85rem;
      font-weight: 700;
    }
    .cart-grid {
      display: grid;
      grid-template-columns: 1fr 360px;
      gap: 1.75rem;
      align-items: start;
    }
    @media (max-width: 900px) {
      .cart-grid { grid-template-columns: 1fr; gap: 1rem; }
    }

    /* Items Section */
    .cart-items-box {
      background: #fff;
      border-radius: 16px;
      padding: 0.75rem 1rem;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
    }
    /* Cart Item: flex column card */
    .cart-item {
      padding: 1rem 0;
      border-bottom: 1px solid #f1f1f1;
    }
    .cart-item:last-child { border-bottom: none; }
    /* Top row: info + image */
    .cart-item-top {
      display: flex;
      align-items: flex-start;
      gap: 0.75rem;
    }
    .cart-item-img {
      width: 82px;
      height: 82px;
      border-radius: 12px;
      object-fit: cover;
      border: 1px solid #eee;
      flex-shrink: 0;
      order: 2; /* image on left in RTL = order 2 */
    }
    .cart-item-info {
      flex: 1;
      order: 1;
      min-width: 0;
    }
    .cart-item-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: #1a1a2e;
      margin: 0 0 0.3rem;
      line-height: 1.4;
    }
    .cart-item-price {
      color: var(--primary-color, #4f46e5);
      font-weight: 800;
      font-size: 1rem;
      margin: 3px 0;
    }
    /* Bottom row: delete + qty */
    .cart-item-bottom {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      margin-top: 0.65rem;
      flex-wrap: wrap;
    }
    .qty-control {
      display: flex;
      align-items: center;
      gap: 0.35rem;

    .qty-btn {

      height: 30px;

      border-radius: 8px;
      background: transparent;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
      font-weight: 700;
      color: #374151;
    }
    .qty-btn:hover:not(:disabled) {
      background: #e5e7eb;

    }
    .qty-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .qty-val {

      font-weight: 700;

      color: #111;

    .item-delete-btn {

    /* Loading skeleton */
    .skeleton {
      background: linear-gradient(90deg, #f1f1f1 25%, #e8e8e8 50%, #f1f1f1 75%);
      background-size: 200% 100%;
      animation: shimmer 1.4s infinite;
      border-radius: 10px;
    }
    @keyframes shimmer {
      0% { background-position: 200% 0; }
      100% { background-position: -200% 0; }

    /* Toast notification */
    .cart-toast {
      position: fixed;
      bottom: 2rem;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1e293b;
      color: #fff;
      padding: 0.8rem 1.5rem;
      border-radius: 50px;
      font-weight: 700;
      font-size: 0.9rem;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 9999;
      pointer-events: none;
    }
    .cart-toast.show {
      transform: translateX(-50%) translateY(0);
    }

    /* ===== Mobile Fixes ===== */
    @media (max-width: 768px) {
      /* منع الكارت من لمس الحافة */
      .cart-page { padding: 1rem 0 5rem; }
      main.container { padding: 0 12px; }
      
      /* Summary card — مش sticky على الموبايل */
      .summary-card {
        position: static;

        padding: 1.25rem;

        border-radius: 14px;

      }

      /* الصورة أصغر على الموبايل */
      .cart-item-img {
        width: 72px;
        height: 72px;
      }

      /* الـ price في الـ bottom row */
      .item-line-total {
        font-size: 0.95rem;
      }

      /* Summary rows */
      .summary-row { font-size: 0.9rem; }
      .summary-card-title { font-size: 1.05rem; }

      /* Checkout button */
      .checkout-btn { font-size: 1rem; padding: 0.9rem; }
    }
  </style>

  <script>
    // ======================================
    // Cart DB (API-backed) & LocalStorage Sync
    // ======================================
    var cartData = { items: [], saved_items: [], summary: {} };
    var isOfflineFallback = false;

    function getCsrf() {
      var m = document.querySelector('meta[name="csrf-token"]');
      return m ? m.content : '';
    }

    function fmt(n) {
      return new Intl.NumberFormat('en-EG', { maximumFractionDigits: 0 }).format(Math.round(parseFloat(n || 0))) + ' EGP';
    }

    function showToast(msg) {
      var box = document.getElementById('toastBox');
      if (!box) return;
      box.textContent = msg;
      box.classList.add('show');
      setTimeout(function() { box.classList.remove('show'); }, 3000);
    }

    async function loadCart() {
      var items = (typeof BirdCart !== 'undefined') ? (BirdCart.getCart() || []) : [];
      var savedLs = localStorage.getItem('fastorder_saved_items');
      var saved = savedLs ? JSON.parse(savedLs) : [];
      renderLocalStorageCart(items, saved);
      await syncCartWithServer(items, saved);
    }

    async function syncCartWithServer(items, saved) {
      try {
        var url = '/api/cart';
        var queryParts = [];
        if (items && items.length > 0) queryParts.push('sync_items=' + encodeURIComponent(JSON.stringify(items)));
        if (saved && saved.length > 0) queryParts.push('sync_saved_items=' + encodeURIComponent(JSON.stringify(saved)));
        if (queryParts.length > 0) url += '?' + queryParts.join('&');
        var res = await fetch(url, { headers: { 'X-Requested-With': 'XMLHttpRequest', 'Accept': 'application/json' } });
        if (res.ok) {
          var data = await res.json();
          if (data && data.cross_sells) renderCrossSells(data.cross_sells);
        }
      } catch (e) { console.warn('Silent cart sync failed:', e); }
    }

    function renderLocalStorageCart(items, saved) {
      document.getElementById('cart-loading').style.display = 'none';
      if (items.length === 0 && saved.length === 0) { showEmpty(); return; }
      document.getElementById('cart-empty').style.display = 'none';
      document.getElementById('cart-content').style.display = 'grid';
      var subtotal = 0;
      var badge = document.getElementById('items-count-badge');
      badge.style.display = 'inline-block';
      badge.textContent = items.length + ' منتج';
      var html = items.map(function(it, idx) {
        var line = (it.price || 0) * (it.qty || 1);
        subtotal += line;
        var variantTagsLs = '';
        if (it.selectedSize || it.size) variantTagsLs += '<span class="variant-tag">المقاس: ' + (it.selectedSize || it.size) + '</span>';
        if (it.selectedColor || it.color) variantTagsLs += '<span class="variant-tag">اللون: ' + (it.selectedColor || it.color) + '</span>';
        if (it.options) {
          for (var optK in it.options) {
            if (it.options[optK]) {
              variantTagsLs += '<span class="variant-tag">' + optK + ': ' + it.options[optK] + '</span>';
            }
          }
        }
        var discountBadgeLs = '';
        var pbLs = parseFloat(it.price_before || it.priceBefore || 0);
        var paLs = parseFloat(it.price || 0);
        if (pbLs > paLs && pbLs > 0) {
          var pctLs = Math.round(((pbLs - paLs) / pbLs) * 100);
          discountBadgeLs = '<span class="cart-badge cart-badge-discount">خصم ' + pctLs + '%</span>';
        }
        var shippingBadgeLs = (it.shipping_type === 'free') ? '<span class="cart-badge cart-badge-free">شحن مجاناً</span>' : '';
        return '<div class="cart-item">' +
          '<div class="cart-item-top">' +
            '<div class="cart-item-info">' +
              '<p class="cart-item-name">' + (it.name || 'منتج') + '</p>' +
              (variantTagsLs ? '<div class="cart-item-variant">' + variantTagsLs + '</div>' : '') +
              '<p class="cart-item-price">' + fmt(it.price) + '</p>' +
              ((discountBadgeLs || shippingBadgeLs) ? '<div class="cart-item-badges">' + discountBadgeLs + shippingBadgeLs + '</div>' : '') +
            '</div>' +
            '<img src="' + (it.image || '/shop/placeholder.jpg') + '" class="cart-item-img" alt="' + (it.name||'') + '" onerror="this.src=\'/shop/placeholder.jpg\'">' +
          '</div>' +
          '<div class="cart-item-bottom">' +
            '<button class="item-delete-btn" onclick="lsRemove(' + idx + ', false)" title="حذف المنتج"><i class="fa fa-trash"></i></button>' +
            '<div class="qty-control">' +
              '<button class="qty-btn" onclick="lsUpdateQty(' + idx + ',-1)">−</button>' +
              '<span class="qty-val">' + (it.qty || 1) + '</span>' +
              '<button class="qty-btn" onclick="lsUpdateQty(' + idx + ',1)">+</button>' +
            '</div>' +
            '<div class="item-line-total">' + fmt(line) + '</div>' +
          '</div>' +
        '</div>';
      }).join('');
      document.getElementById('cart-items-list').innerHTML = html;
      document.getElementById('sum-subtotal').textContent = fmt(subtotal);
      var couponCode = localStorage.getItem('fastorder_coupon_code');
      var couponType = localStorage.getItem('fastorder_coupon_type');
      var couponValue = parseFloat(localStorage.getItem('fastorder_coupon_value') || 0);
      var discount = 0;

      if (couponCode && couponValue > 0) {
        if (couponType === 'percentage') {
          discount = (subtotal * couponValue) / 100;
        } else {
          discount = couponValue;
        }
        discount = Math.min(discount, subtotal);
      }

      if (discount > 0 && couponCode) {
        document.getElementById('sum-discount-row').style.display = 'flex';
        document.getElementById('sum-discount').textContent = '−' + fmt(discount);
        document.getElementById('sum-coupon-code').textContent = '(' + couponCode + ')';
        document.getElementById('coupon-input').value = couponCode;
        document.getElementById('sum-total').textContent = fmt(Math.max(0, subtotal - discount));
      } else {
        document.getElementById('sum-discount-row').style.display = 'none';
        document.getElementById('coupon-input').value = '';
        document.getElementById('sum-total').textContent = fmt(subtotal);
      }
      var savedBox = document.getElementById('saved-box');
      if (saved && saved.length > 0) {
        savedBox.style.display = 'block';
        document.getElementById('saved-items-list').innerHTML = saved.map(function(item, sIdx) {
          return '<div class="saved-item">' +
            '<img src="' + (item.image || '/shop/placeholder.jpg') + '" class="saved-item-img" alt="' + item.name + '" onerror="this.src=\'/shop/placeholder.jpg\'">' +
            '<div style="flex:1;">' +
              '<p style="font-weight:700;font-size:0.95rem;">' + item.name + '</p>' +
              '<p class="cart-item-price">' + fmt(item.price) + '</p>' +
            '</div>' +
            '<div class="saved-actions">' +
              '<button class="btn-sm-primary" onclick="lsMoveToCart(' + sIdx + ')">🛒 أضف للسلة</button>' +
              '<button class="btn-sm-danger" onclick="lsRemove(' + sIdx + ', true)" title="حذف">🗑️</button>' +
            '</div>' +
          '</div>';
        }).join('');
      } else { savedBox.style.display = 'none'; }
      if (typeof BirdCart !== 'undefined' && BirdCart.updateCartCount) BirdCart.updateCartCount(items.length);
      var cartCountEl = document.getElementById('cartCount');
      if (cartCountEl && items.length > 0) cartCountEl.textContent = items.length;
    }

    function renderCrossSells(crossSells) {
      var crossSellsBox = document.getElementById('cart-cross-sells');
      var crossSellsList = document.getElementById('cart-cross-sells-list');
      if (crossSells.length > 0 && crossSellsBox && crossSellsList) {
        crossSellsBox.style.display = 'block';
        crossSellsList.innerHTML = crossSells.map(function(prod) {
          return `<div style="background:#f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; gap: 10px; transition: transform 0.2s; text-align: right;" onmouseenter="this.style.transform='translateY(-2px)'" onmouseleave="this.style.transform='translateY(0)'">
              <a href="/shop/product.html?id=${prod.id}" style="text-decoration:none; color:inherit;">
                <img src="${prod.image_url || '/shop/placeholder.jpg'}" style="width:100%; height:120px; object-fit:cover; border-radius:12px; border: 1px solid #eee;" onerror="this.src='/shop/placeholder.jpg'">
                <p style="font-weight:700; font-size:0.9rem; margin:8px 0 4px; color:#1e293b; line-height:1.4; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; height:2.8em;">${prod.name}</p>
                <div style="display:flex; align-items:baseline; gap:6px;">
                  <span style="font-weight:800; color:var(--primary-color,#4f46e5); font-size:0.95rem;">${fmt(prod.price_after)}</span>
                  ${prod.price_before && prod.price_before > prod.price_after ? `<span style="text-decoration:line-through; color:#94a3b8; font-size:0.8rem;">${fmt(prod.price_before)}</span>` : ''}
                </div>
              </a>
              <button onclick="addCrossSellToCart(${prod.id}, '${prod.name.replace(/'/g, "\\'")}', ${prod.price_after}, '${prod.image_url || ''}')" style="width:100%; padding:8px; background:var(--primary-color,#4f46e5); color:#fff; border:none; border-radius:10px; font-weight:700; font-size:0.82rem; cursor:pointer; display:flex; align-items:center; justify-content:center; gap:4px; transition:opacity 0.2s;" onmouseenter="this.style.opacity='0.9'" onmouseleave="this.style.opacity='1'">
                <i class="fa fa-cart-plus"></i> أضف للسلة
              </button>
            </div>`;
        }).join('');
      } else if (crossSellsBox) crossSellsBox.style.display = 'none';
    }

    function lsUpdateQty(idx, delta) {
      var items = BirdCart.getCart();
      items[idx].qty = Math.max(1, (items[idx].qty || 1) + delta);
      BirdCart.saveCart(items);
      loadCart();
      showToast('تم تحديث الكمية');
    }

    function lsRemove(idx, isSaved) {
      if (!confirm('هل تريد حذف هذا المنتج؟')) return;
      if (isSaved) {
        var savedLs = localStorage.getItem('fastorder_saved_items');
        var saved = savedLs ? JSON.parse(savedLs) : [];
        saved.splice(idx, 1);
        localStorage.setItem('fastorder_saved_items', JSON.stringify(saved));
      } else {
        var items = BirdCart.getCart();
        items.splice(idx, 1);
        BirdCart.saveCart(items);
      }
      loadCart();
      showToast('تم حذف المنتج');
    }

    function lsSaveForLater(idx) {
      var items = BirdCart.getCart();
      var item = items.splice(idx, 1)[0];
      BirdCart.saveCart(items);
      var savedLs = localStorage.getItem('fastorder_saved_items');
      var saved = savedLs ? JSON.parse(savedLs) : [];
      saved.push(item);
      localStorage.setItem('fastorder_saved_items', JSON.stringify(saved));
      loadCart();
      showToast('تم الحفظ لوقت لاحق');
    }

    function lsMoveToCart(idx) {
      var savedLs = localStorage.getItem('fastorder_saved_items');
      var saved = savedLs ? JSON.parse(savedLs) : [];
      var item = saved.splice(idx, 1)[0];
      localStorage.setItem('fastorder_saved_items', JSON.stringify(saved));
      var items = BirdCart.getCart() || [];
      items.push(item);
      BirdCart.saveCart(items);
      loadCart();
      showToast('تمت الإضافة للسلة');
    }

    function showEmpty() {
      document.getElementById('cart-loading').style.display = 'none';
      document.getElementById('cart-content').style.display = 'none';
      document.getElementById('cart-empty').style.display = 'block';
    }

    function addCrossSellToCart(productId, name, price, imageUrl) {
      if (typeof BirdCart !== 'undefined' && BirdCart.addToCart) {
        window.BirdCart.addToCart({
          id: productId, name: name, price: price, image: imageUrl || null,
          shipping_type: 'free', qty: 1, selectedSize: null, selectedColor: null,
        });
        loadCart();
        showToast('تمت إضافة المنتج المكمل');
      }
    }

    async function applyCoupon() {
      var code = document.getElementById('coupon-input').value.trim();
      if (!code) return;
      var msgEl = document.getElementById('coupon-msg');
      msgEl.textContent = 'جاري التحقق...';
      try {
        var res = await fetch('/api/cart/coupon', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', 'X-CSRF-TOKEN': getCsrf(), 'X-Requested-With': 'XMLHttpRequest' },
          body: JSON.stringify({ code: code })
        });
        var data = await res.json();
        msgEl.textContent = data.message;
        msgEl.style.color = data.success ? '#16a34a' : '#ef4444';
        if (data.success && data.summary && data.summary.coupon) {
          localStorage.setItem('fastorder_coupon_code', code);
          localStorage.setItem('fastorder_coupon_type', data.summary.coupon.type);
          localStorage.setItem('fastorder_coupon_value', data.summary.coupon.value);
          loadCart();
          showToast('تم تطبيق كود الخصم');
        }
      } catch (e) {
        msgEl.textContent = 'حدث خطأ، حاول مرة أخرى';
        msgEl.style.color = '#ef4444';
      }
    }

    async function removeCoupon() {
      var msgEl = document.getElementById('coupon-msg');
      msgEl.textContent = 'جاري إزالة الكوبون...';
      try {
        var res = await fetch('/api/cart/coupon', {
          method: 'DELETE',
          headers: { 'X-CSRF-TOKEN': getCsrf(), 'X-Requested-With': 'XMLHttpRequest' }
        });
        var data = await res.json();
        if (data.success || res.ok) {
          msgEl.textContent = 'تمت إزالة الكوبون';
          msgEl.style.color = '#16a34a';
          localStorage.removeItem('fastorder_coupon_code');
          localStorage.removeItem('fastorder_coupon_type');
          localStorage.removeItem('fastorder_coupon_value');
          localStorage.removeItem('fastorder_coupon_discount');
          loadCart();
          showToast('تمت إزالة كود الخصم');
        }
      } catch (e) {
        msgEl.textContent = 'حدث خطأ، حاول مرة أخرى';
        msgEl.style.color = '#ef4444';
      }
    }

    // Load cart on page load
    loadCart();

    // Load settings dynamically (logo, phone, whatsapp)
    (function () {
      var API = window.API_BASE || '/public-api';
      fetch(API + '/settings').then(function (r) { return r.json(); }).then(function (res) {
        var data = res.data;
        if (!data) return;
        if (data.logo_url) {
          document.querySelectorAll('img.site-logo, .brand img:first-child, .brand img').forEach(function (el) { el.src = data.logo_url; });
        }
        if (data.store_name) {
          document.querySelectorAll('.site-name, .brand span:first-of-type').forEach(function (el) { el.textContent = data.store_name; });
        }
        if (data.phone) {
          document.querySelectorAll('a.call-now, a[href^="tel:"]').forEach(function (el) { el.href = 'tel:' + data.phone; });
        }
        if (data.whatsapp) {
          document.querySelectorAll('a.wapp-float, a[href*="wa.me"]').forEach(function (el) { el.href = 'https://wa.me/' + data.whatsapp; });
        }
      }).catch(function () { });
    })();
  </script>
</body>

</html>
